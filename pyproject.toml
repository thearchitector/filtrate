[project]
name = "sqlafilters"
version = "0.1.0"
description = "Filtering mixin for SQLAlchemy"
readme = "README.md"
license = "BSD-3-Clause-Clear"
authors = [
    { name = "Elias Gabriel", email = "oss@eliasfgabriel.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov",
    "pytest-crap",
]
local = [
    "prek",
    "mypy",
]

[tool.pytest.ini_options]
strict = true
addopts = "-ra -vv --crap --cov sqlafilters --import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["TYPE_CHECKING"]

[tool.ruff]
unsafe-fixes = false
extend-include = ["*.md"]

[tool.ruff.lint]
extend-select = ["ANN", "ASYNC", "PYI", "PT", "SIM", "TID", "PERF", "TRY", "PGH003"]
extend-ignore = ["TID252", "TRY003"]
preview = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
preview = true

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
strict-literal-narrowing = true
strict-generic-narrowing = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
